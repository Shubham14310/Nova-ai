name: Build Nova AI Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "server/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "server/**"
      - "assets/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Nova AI splash artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 512 -h 512 -o assets/nova-splash.png assets/nova-splash.svg
          rsvg-convert -w 1024 -h 1024 -o assets/nova-icon.png assets/nova-icon.svg
          test -s assets/nova-splash.png
          test -s assets/nova-icon.png

      - name: Install dependencies
        run: npm install

      - name: Align Expo native packages with the installed SDK
        run: npx expo install --fix

      - name: Install SDK-compatible splash screen package
        run: npx expo install expo-splash-screen

      - name: Verify Android JavaScript bundle
        run: npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      # Debug builds normally expect Metro. Force Gradle to embed the JS bundle.
      - name: Configure standalone debug APK bundle
        run: |
          grep -q '^react {' android/app/build.gradle
          sed -i '/^react {/a\    debuggableVariants = []' android/app/build.gradle
          grep -A 3 '^react {' android/app/build.gradle

      - name: Build installable APK with embedded JavaScript
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/generated/assets/createBundleDebugJsAndAssets/index.android.bundle

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-AI-standalone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
